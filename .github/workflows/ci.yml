name: receiver-ci

on:
  push:
  pull_request:

jobs:
  deployment-edge:
    # Bounded live evidence only on the explicitly authorized deployment branch.
    if: github.ref == 'refs/heads/codex/stackot-local-deploy-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do not automate private-port claims against a potentially stale origin IP.
      - run: python3 deploy/macos/verify-public.py --output "$RUNNER_TEMP/stackot-edge.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stackot-deployment-edge
          path: ${{ runner.temp }}/stackot-edge.json

  ingress-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y caddy
      - run: python3 deploy/macos/verify-ingress.py
      - run: python3 deploy/macos/verify-migration.py
      - run: python3 -m unittest discover -s deploy -p test_alerts.py -v
      - run: python3 -m py_compile docs/verification/s47-probe.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Synthetic HTTP fixture verifies observation transparency, not D restore.
      - run: bun docs/verification/s47-observer-fixture.ts
      - run: python3 -m py_compile deploy/macos/render.py deploy/macos/gateway-run.py deploy/macos/probe.py

  receiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # S24: pinned runtime-config template oracle on the pushed SHA. Schema /
  # sandbox-policy evidence only -- synthetic IDs, isolated state dir; the
  # oracle installs the pinned acpx/discord plugins into that state. No
  # gateway, Discord connection, model call, worker, or real secrets.
  runtime-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --global openclaw@2026.9.6 --allow-scripts=openclaw
      - run: openclaw --version
      - run: node deploy/verify-openclaw-template.mjs
      # S25: real local Gateway/native SDK restart; synthetic values only.
      - run: python3 docs/verification/s25-probe/run.py --output "$RUNNER_TEMP/s25-restart.json"
      # S26: product repository through actual native store in a new Gateway.
      - run: bun install --frozen-lockfile
        working-directory: gateway
      - run: bun run typecheck && bun run test && bun run build
        working-directory: gateway
      - run: python3 gateway/scripts/build-native-probe.py
      - run: python3 docs/verification/s25-probe/run.py --plugin gateway/node_modules/s26-native-plugin --method s26probe.state --expect-approval --output "$RUNNER_TEMP/s26-restart.json"
      # S35: fake external marker + real native inflight/receipt across restart.
      - run: python3 gateway/scripts/build-thread-probe.py
      - run: python3 docs/verification/s25-probe/run.py --plugin gateway/node_modules/s35-native-plugin --method s35probe.state --expect-thread --output "$RUNNER_TEMP/s35-restart.json"
      # S28 bootstrap only: actual private plugin, no actor/Discord/model call.
      - run: python3 gateway/scripts/build-plugin.py
      - run: python3 docs/verification/s25-probe/run.py --plugin gateway/node_modules/stackot-plugin --plugin-agent stackot --method stackotgateway.health --expect-bootstrap --output "$RUNNER_TEMP/s28-bootstrap.json"
      # Pinned installed-library render/parser contract; no provider/actor send.
      - run: npm install --prefix "$RUNNER_TEMP/s28-sdk-contract" --ignore-scripts openclaw@2026.9.6 @openclaw/discord@2026.9.6
      - run: node gateway/scripts/verify-prompt-contract.mjs "$RUNNER_TEMP/s28-sdk-contract/node_modules/@openclaw/discord/dist/.setup/components-yBEb75bB.mjs" "$RUNNER_TEMP/s28-sdk-contract/node_modules/openclaw/dist/interactive-registry-CopvmBe6.mjs"
